# mutmut config (https://github.com/boxed/mutmut)
# Merge this into your project's pyproject.toml under [tool.mutmut].
# Adjust paths_to_mutate to your source directory.
[tool.mutmut]
paths_to_mutate = ["<your/src/dir>"]
tests_dir = "qa/hidden"
# Run the QA harness as the test command: parallel-safe, no network.
runner = "bash qa/run_qa.sh"